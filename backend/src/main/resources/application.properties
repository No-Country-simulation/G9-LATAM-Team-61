spring.application.name=backend
server.port=${SERVER_PORT:8080}

# Se debe configurar el perfil explícitamente mediante la variable de entorno:
# Valores válidos para despliegue / desarrollo: local | prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Seguridad: Configuración de Orígenes Permitidos (CORS)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Configuración de PostgreSQL (Soporta DB_* y POSTGRES_*)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:hackaton_db}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Inicialización de SQL (Habilitación de pg_trgm)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true