openapi: 3.1.0
info:
  title: Borrador de API interna de inferencia de TechMind
  version: 0.2.0-draft
  description: >-
    Propuesta pendiente de validación por Data para la integración entre
    Spring Boot y FastAPI. No representa un contrato aprobado ni describe
    el mock temporal /analizar.
x-estado: pendiente-validacion-data
paths:
  /predict:
    post:
      operationId: predecirContenido
      summary: Propuesta para clasificar un contenido técnico individual
      description: >-
        Endpoint y esquemas sujetos a validación o ajuste por Data y posterior
        revisión de compatibilidad por Backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudPrediccionPropuesta'
            examples:
              propuesta:
                externalValue: './examples/inference-request.proposed.json'
      responses:
        '200':
          description: Respuesta propuesta para una predicción completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPrediccionPropuesta'
              examples:
                propuesta:
                  externalValue: './examples/inference-response.proposed.json'
components:
  schemas:
    SolicitudPrediccionPropuesta:
      type: object
      additionalProperties: false
      required:
        - contenido_crudo
      properties:
        contenido_crudo:
          type: string
          description: Texto compuesto que se propone enviar al servicio real
    RespuestaPrediccionPropuesta:
      type: object
      additionalProperties: false
      required:
        - categoria
        - probabilidad
        - palabras_clave
      properties:
        categoria:
          type: string
          description: Categoría predicha; la taxonomía está pendiente de Data
        probabilidad:
          type: number
          format: double
          description: Confianza o probabilidad según defina Data
        palabras_clave:
          type: array
          items:
            type: string
          description: Palabras clave extraídas por el pipeline
