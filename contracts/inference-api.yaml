openapi: 3.1.0
info:
  title: Contrato base de API interna de inferencia de TechMind
  version: 0.4.0-partial
  description: >-
    Contrato parcial vigente para la clasificación individual entre Spring Boot
    y FastAPI. Documenta exclusivamente POST /predict; batch, clustering,
    health y rutas legacy se describen en el OpenAPI generado por el servicio.
x-estado: parcial-vigente
paths:
  /predict:
    post:
      operationId: predecirContenido
      summary: Clasifica un contenido técnico individual
      description: >-
        Contrato canónico implementado por FastAPI y consumido por Spring Boot.
        Los cambios incompatibles requieren un acuerdo explícito y una
        actualización de este documento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudPrediccion'
            examples:
              baseline:
                externalValue: './examples/inference-request.json'
      responses:
        '200':
          description: Predicción completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPrediccion'
              examples:
                baseline:
                  externalValue: './examples/inference-response.json'
        '400':
          description: JSON malformado o no interpretable
        '415':
          description: Content-Type no soportado
        '422':
          description: Validación de esquema, campos o longitud fallida
        '500':
          description: Error interno sanitizado
        '503':
          description: Modelo no disponible
components:
  schemas:
    SolicitudPrediccion:
      type: object
      additionalProperties: false
      required:
        - contenido_crudo
      properties:
        contenido_crudo:
          type: string
          minLength: 30
          maxLength: 5000
          description: Texto técnico que Spring Boot envía al servicio real
    RespuestaPrediccion:
      type: object
      additionalProperties: false
      required:
        - categoria
        - probabilidad
        - palabras_clave
      properties:
        categoria:
          type: string
          enum:
            - Backend
            - Frontend
            - DevOps
            - Data Science
            - Mobile
            - Otros
          description: Categoría predicha por el modelo
        probabilidad:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confianza o probabilidad devuelta por el modelo
        palabras_clave:
          type: array
          items:
            type: string
          description: Palabras clave extraídas por el pipeline
        tiempo_procesamiento_ms:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          description: Tiempo de procesamiento de la inferencia en milisegundos
