name: techmind-baseline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - data

  inference:
    build:
      context: ./inference-service
      dockerfile: Dockerfile
    environment:
      MIN_TEXT_LENGTH: ${MIN_TEXT_LENGTH:-30}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-5000}
      KEYWORDS_TOP_N: ${KEYWORDS_TOP_N:-8}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-100}
      MAX_CLUSTERING_DOCS: ${MAX_CLUSTERING_DOCS:-200}
      TRANSLATOR_BACKEND: none
      TRANSLATE_TARGET_LANG: ${TRANSLATE_TARGET_LANG:-en}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5));
          assert data.get('status') == 'ok' and data.get('model_loaded') is True
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 90s
    restart: unless-stopped
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8080}
      FASTAPI_URL: http://inference:8000
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Define POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:${FRONTEND_HTTP_PORT},http://localhost:${FRONTEND_HTTP_PORT}}
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error http://localhost:8080/api/health
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - app
      - data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_DEMO: "false"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:?Define FRONTEND_HTTP_PORT in .env}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge
      - app

volumes:
  postgres_data:

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
