name: Inference Service CI

on:
  pull_request:
    paths:
      - 'inference-service/**'
      - '.github/workflows/inference-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'inference-service/**'
      - '.github/workflows/inference-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./inference-service

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'inference-service/requirements.txt'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar existencia del modelo canónico
        run: |
          test -f model/modelo_hacka.pkl || (echo "Error: model/modelo_hacka.pkl no encontrado" && exit 1)

      - name: Ejecutar pruebas automatizadas con pytest
        env:
          TRANSLATOR_BACKEND: none
        run: |
          pytest -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar Build de la Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./inference-service
          file: ./inference-service/Dockerfile
          push: false
          tags: inference-service:test
