services:
  frontend:
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./frontend/nginx.https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${LETSENCRYPT_PATH:-/etc/letsencrypt}
        target: /etc/letsencrypt
        read_only: true
      - type: bind
        source: ${ACME_WEBROOT_PATH:-/var/lib/techmind/acme}
        target: /var/www/certbot
        read_only: true
